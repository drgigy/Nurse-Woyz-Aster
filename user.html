<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nurse WOYZ Notes</title>
<link rel="manifest" href="./manifest.webmanifest">
<style>
  :root{--ink:#1d2520;--muted:#6f7b72;--line:#dfe7e2;--panel:#f7faf7;--teal:#1f6656;--teal2:#174d41;--wash:#eaf5f1;--red:#d94b38}
  *{box-sizing:border-box}
  body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:#f4f7f4}
  button,input,textarea{font:inherit}
  .hidden{display:none!important}
  .login{min-height:100vh;display:grid;place-items:center;padding:22px}
  .login-card{width:min(420px,100%);background:white;border:1px solid var(--line);border-radius:16px;padding:26px;box-shadow:0 18px 50px -34px #000}
  .brand{display:inline-flex;align-items:center;gap:10px;border:3px solid #f45155;border-radius:999px;background:#17171d;color:white;padding:10px 18px;font-weight:900;font-size:24px;letter-spacing:.5px}
  .dot{width:24px;height:24px;border-radius:50%;background:#f45155;box-shadow:0 0 0 10px rgba(244,81,85,.22)}
  h1{margin:22px 0 8px;font-size:32px}
  .sub{color:var(--muted);line-height:1.45}
  label{display:block;margin:16px 0 7px;font-weight:800;font-size:13px}
  input,textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;background:white;color:var(--ink);padding:12px 13px;outline:none}
  input:focus,textarea:focus{border-color:#8ab9ab;box-shadow:0 0 0 3px rgba(31,102,86,.12)}
  .btn{min-height:42px;border:1px solid var(--line);border-radius:12px;background:white;color:var(--ink);font-weight:900;padding:0 16px;cursor:pointer}
  .btn.primary{background:var(--teal);border-color:var(--teal);color:white}
  .btn.primary:hover{background:var(--teal2)}
  .btn.danger{color:var(--red);background:#fff3f1;border-color:#f3cbc4}
  .login .btn{width:100%;margin-top:18px}
  .error{min-height:20px;margin-top:12px;color:var(--red);font-weight:800;font-size:13px}
  .app{height:100vh;display:grid;grid-template-columns:320px 1fr;background:white}
  .side{border-right:1px solid var(--line);background:#fbfdfb;display:flex;flex-direction:column;min-width:0}
  .side-head{padding:18px 18px 12px;border-bottom:1px solid var(--line)}
  .side-title{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .side .brand{font-size:18px;padding:7px 13px;border-width:2px}
  .side .dot{width:16px;height:16px;box-shadow:0 0 0 7px rgba(244,81,85,.22)}
  .date-row{display:flex;align-items:center;gap:8px;margin-top:14px}
  .icon{width:38px;height:38px;padding:0;border-radius:10px}
  .date-input{height:38px;font-weight:800}
  .search{margin-top:10px}
  .list{padding:12px;overflow:auto;display:grid;gap:9px}
  .patient{border:1px solid transparent;background:transparent;border-radius:12px;padding:12px;text-align:left;cursor:pointer}
  .patient.active{background:var(--wash);border-color:#bedbd2}
  .patient-name{font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .patient-meta{margin-top:4px;color:var(--muted);font:800 12px ui-monospace,SFMono-Regular,Menlo,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .main{min-width:0;display:flex;flex-direction:column;height:100vh}
  .top{height:64px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 16px;overflow:auto}
  .mobile-only{display:none}
  .spacer{flex:1}
  .who{color:var(--muted);font-size:13px;font-weight:800;white-space:nowrap}
  .content{flex:1;overflow:auto;padding:26px}
  .home{min-height:100%;display:grid;place-items:center;text-align:center}
  .home-inner{width:min(560px,100%);display:grid;gap:18px;justify-items:center}
  .home .brand{font-size:28px}
  .home-actions{display:grid;gap:12px;width:min(340px,100%)}
  .home-actions .btn{min-height:58px;font-size:18px}
  .hint{color:var(--muted);line-height:1.45}
  .ocr-capture{position:fixed;left:-1000px;top:0;width:1px;height:1px;opacity:.01}
  .scan-card{width:min(560px,100%);margin:auto;display:grid;gap:16px;text-align:center}
  .patient-big{font-size:32px;font-weight:900}
  .patient-lines{display:grid;gap:6px;color:var(--muted);font-weight:900}
  .editor{max-width:900px;margin:0 auto;display:grid;gap:16px}
  .identity{border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:14px;display:grid;gap:8px}
  .identity-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .note-title{font-size:28px;font-weight:900;margin:0}
  .note-box{min-height:280px;resize:vertical;line-height:1.55;font-size:17px}
  .editor-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .status{min-height:20px;color:var(--muted);font-weight:800;font-size:13px}
  @media(max-width:760px){
    .app{grid-template-columns:1fr}
    .side{position:fixed;inset:0 20% 0 0;z-index:10;transform:translateX(-105%);transition:.2s transform;box-shadow:20px 0 45px -32px #000}
    .app.list-open .side{transform:none}
    .mobile-only{display:inline-flex}
    .top{height:58px;padding:0 10px}
    .content{padding:18px 14px 90px}
    .who,.top .spacer{display:none}
    .home .brand{font-size:24px}
    .identity-grid{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<section class="login" id="loginScreen">
  <form class="login-card" id="loginForm">
    <div class="brand"><span class="dot"></span>Nurse WOYZ</div>
    <h1>Sign in</h1>
    <div class="sub">Use the Firebase user account to create progress notes.</div>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" required>
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <button class="btn primary" id="loginBtn">Sign in</button>
    <div class="error" id="loginError"></div>
  </form>
</section>
<section class="app hidden" id="app">
  <aside class="side">
    <div class="side-head">
      <div class="side-title"><div class="brand"><span class="dot"></span>Nurse WOYZ</div><button class="btn icon mobile-only" id="closeListBtn">x</button></div>
      <div class="date-row"><button class="btn icon" id="prevDateBtn">&lsaquo;</button><input class="date-input" id="dateInput" type="date"><button class="btn icon" id="nextDateBtn">&rsaquo;</button></div>
      <input class="search" id="searchInput" placeholder="Search patient or UHID">
    </div>
    <div class="list" id="patientList"></div>
  </aside>
  <main class="main">
    <div class="top">
      <button class="btn mobile-only" id="listBtn">List</button>
      <button class="btn" id="homeBtn">Home</button>
      <button class="btn primary" id="newNoteBtn">Progress note</button>
      <div class="spacer"></div><div class="who" id="userEmail"></div><button class="btn danger" id="signOutBtn">Sign out</button>
    </div>
    <div class="content" id="content"></div>
    <textarea class="ocr-capture" id="ocrCapture" inputmode="none" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="OCR capture"></textarea>
  </main>
</section>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js';
import { browserLocalPersistence, getAuth, onAuthStateChanged, setPersistence, signInWithEmailAndPassword, signOut } from 'https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js';
import { addDoc, collection, doc, getFirestore, onSnapshot, orderBy, query, serverTimestamp, setDoc, updateDoc } from 'https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js';
import { firebaseConfig } from './firebase-config.js';
const fb = initializeApp(firebaseConfig), auth = getAuth(fb), db = getFirestore(fb);
setPersistence(auth, browserLocalPersistence);
const $ = id => document.getElementById(id);
const loginScreen=$('loginScreen'), loginForm=$('loginForm'), loginError=$('loginError'), loginBtn=$('loginBtn'), appShell=$('app'), content=$('content'), patientList=$('patientList'), dateInput=$('dateInput'), searchInput=$('searchInput'), ocrCapture=$('ocrCapture'), userEmail=$('userEmail');
let currentUser=null, unsub=null, notes=[], selectedDate=new Date(), selectedKey=null, activeScan=null, activeNote=null, recognition=null, recognizing=false, ocrTimer=null;
function isoDate(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function norm(v){return String(v||'').trim()}
function cleanUhid(v){const m=String(v||'').match(/\b\d{9}\b/);return m?m[0]:''}
function cleanSex(v){const t=String(v||'').toLowerCase();if(t.startsWith('m'))return'Male';if(t.startsWith('f'))return'Female';return norm(v)}
function titleName(v){return norm(v).replace(/^(Mr|Mrs|Ms|Miss|Master|Baby)\.?\s+/i,'').replace(/\s+/g,' ').replace(/\b\w/g,c=>c.toUpperCase())}
function patientKey(p){return p.uhid?`uhid:${p.uhid}`:`name:${[p.name,p.age,p.sex].map(x=>norm(x).toLowerCase()).join('|')}`}
function label(p){return p.name||'Unnamed patient'}
function meta(p){return[`UHID ${p.uhid||'NIL'}`,p.age?`${p.age} yrs`:'',p.sex||''].filter(Boolean).join(' · ')}
function blankPatient(){return{name:'',age:'',sex:'',uhid:''}}
function parseCredential(v){
  const raw=norm(v).replace(/\r\n/g,'\n'), text=raw.replace(/\s+/g,' ').trim(); if(!text)return null;
  const uhid=cleanUhid(text.match(/\b(?:Aster\s*ID|AsterID|UHID)\s*:?\s*(\d{9})/i)?.[1]||text);
  const ageSex=text.match(/\b(\d{1,3})\s*(?:Yrs?|Years?)?\s*\/\s*(Male|Female|M|F)\b/i);
  const age=ageSex?.[1]||'', sex=cleanSex(ageSex?.[2]||'');
  const nameLine=raw.split('\n').map(x=>x.trim()).find(x=>/^(Mr|Mrs|Ms|Miss|Master|Baby)\.?\s+/i.test(x));
  let name=nameLine?titleName(nameLine.replace(/\b\d{1,3}\s*(?:Yrs?|Years?)?\s*\/.*$/i,'')):'';
  if(!name){const after=text.replace(/^.*?(?:Aster\s*ID|AsterID)\s*:?\s*\d{9}/i,'').trim();name=titleName(after.split(/\b\d{1,3}\s*(?:Yrs?|Years?)?\s*\/\s*(?:Male|Female|M|F)\b/i)[0])}
  if(!uhid&&!name)return null; return{name:name||'Unnamed patient',age,sex,uhid,rawText:raw};
}
function notePatient(n){const p=n.patientData||{};return{name:p.name||n.patientName||'',age:p.age||n.age||'',sex:p.sex||n.sex||'',uhid:p.uhid||n.uhid||''}}
function groups(){
  const term=searchInput.value.trim().toLowerCase(), map=new Map();
  notes.filter(n=>n.visitDate===isoDate(selectedDate)&&n.deleted!==true).forEach(n=>{const p=notePatient(n), hay=[p.name,p.uhid,p.age,p.sex,n.transcription].join(' ').toLowerCase(); if(term&&!hay.includes(term))return; const key=patientKey(p)||n.id; const g=map.get(key)||{key,patient:p,notes:[]}; if(!g.patient.uhid&&p.uhid)g.patient=p; g.notes.push(n); map.set(key,g)});
  return[...map.values()].map(g=>({...g,notes:g.notes.sort((a,b)=>(b.createdAtMs||0)-(a.createdAtMs||0))})).sort((a,b)=>(b.notes[0]?.createdAtMs||0)-(a.notes[0]?.createdAtMs||0));
}
function renderList(){const gs=groups();patientList.innerHTML=gs.length?gs.map(g=>`<button class="patient ${g.key===selectedKey?'active':''}" data-key="${esc(g.key)}"><div class="patient-name">${esc(label(g.patient))}</div><div class="patient-meta">${esc(meta(g.patient))} · ${g.notes.length} note${g.notes.length===1?'':'s'}</div></button>`).join(''):`<div class="sub" style="padding:10px">${searchInput.value?'No matching patients.':'No notes for this date.'}</div>`}
function renderHome(){activeNote=null;activeScan=null;selectedKey=null;renderList();content.innerHTML=`<div class="home"><div class="home-inner"><div class="brand"><span class="dot"></span>Nurse WOYZ</div><div class="hint">Scan the Aster credential with the device OCR button, or start a Progress note without scanning.</div><div class="home-actions"><button class="btn primary" id="homeProgressBtn">Progress note</button></div><div class="hint">If the same nine-digit UHID is scanned again, the same patient opens.</div></div></div>`;$('homeProgressBtn').onclick=()=>openEditor(activeScan||blankPatient(),null);armOcr()}
function renderScan(patient){activeScan=patient;selectedKey=patientKey(patient);renderList();content.innerHTML=`<div class="home"><div class="scan-card"><div class="patient-big">${esc(label(patient))}</div><div class="patient-lines"><div>UHID ${esc(patient.uhid||'NIL')}</div><div>${esc([patient.age?`${patient.age} yrs`:'',patient.sex].filter(Boolean).join(' · ')||'Age / sex not found')}</div></div><button class="btn primary" id="scanProgressBtn">Progress note</button><button class="btn" id="scanAgainBtn">Scan again</button></div></div>`;$('scanProgressBtn').onclick=()=>openEditor(patient,null);$('scanAgainBtn').onclick=renderHome}
function openEditor(patient,note){stopOcr();activeNote=note||null;const p=patient||blankPatient();content.innerHTML=`<div class="editor"><h1 class="note-title">Progress note</h1><div class="identity"><div class="identity-grid"><input id="pName" placeholder="Patient name" value="${esc(p.name||'')}"><input id="pUhid" placeholder="UHID, 9 digits" value="${esc(p.uhid||'')}" inputmode="numeric"><input id="pAge" placeholder="Age" value="${esc(p.age||'')}" inputmode="numeric"><input id="pSex" placeholder="Sex" value="${esc(p.sex||'')}"></div></div><textarea class="note-box" id="noteText" placeholder="Dictate or type the progress note here.">${esc(note?.transcription||'')}</textarea><div class="editor-actions"><button class="btn primary" id="dictateBtn">Start dictation</button><button class="btn primary" id="saveBtn">Save</button><button class="btn" id="backHomeBtn">Home</button></div><div class="status" id="status"></div></div>`;$('dictateBtn').onclick=toggleDictation;$('saveBtn').onclick=saveNote;$('backHomeBtn').onclick=renderHome;$('noteText').focus()}
function appendLines(t){const box=$('noteText'), parts=String(t||'').replace(/\s+/g,' ').split(/(?<=[.!?])\s+/).map(s=>s.trim()).filter(Boolean); if(!parts.length)return; box.value=[box.value.trim(),parts.join('\n')].filter(Boolean).join('\n')}
function toggleDictation(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){$('status').textContent='Dictation is not supported in this browser.';return} if(recognizing){recognition.stop();return} recognition=new SR();recognition.continuous=true;recognition.interimResults=false;recognition.lang='en-IN';recognition.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal)appendLines(e.results[i][0].transcript)};recognition.onstart=()=>{recognizing=true;$('dictateBtn').textContent='Stop dictation';$('status').textContent='Listening...'};recognition.onend=()=>{recognizing=false;$('dictateBtn').textContent='Start dictation';$('status').textContent=''};recognition.start()}
async function saveNote(){if(!currentUser)return;const p={name:norm($('pName').value),uhid:cleanUhid($('pUhid').value),age:norm($('pAge').value),sex:cleanSex($('pSex').value)}, transcription=$('noteText').value.trim(), now=new Date();const data={heading:'Progress Note',selectedMode:'Progress Note',visitDate:isoDate(selectedDate),isDraft:false,everSaved:true,saved:true,transcription,patientData:p,patientName:p.name,uhid:p.uhid,age:p.age,sex:p.sex,patientKey:patientKey(p),updatedAt:serverTimestamp()};$('status').textContent='Saving...';if(activeNote?.id)await updateDoc(doc(db,'users',currentUser.uid,'notes',activeNote.id),data);else await addDoc(collection(db,'users',currentUser.uid,'notes'),{...data,createdAt:serverTimestamp(),createdAtLabel:now.toLocaleString()});$('status').textContent='Saved';selectedKey=patientKey(p);setTimeout(renderHome,450)}
function openGroup(key){selectedKey=key;appShell.classList.remove('list-open');renderList();const g=groups().find(x=>x.key===key);if(!g)return renderHome();content.innerHTML=`<div class="editor"><h1 class="note-title">${esc(label(g.patient))}</h1><div class="hint">${esc(meta(g.patient))}</div><button class="btn primary" id="newPatientNoteBtn">Progress note</button>${g.notes.map(n=>`<article class="identity"><div class="patient-meta">${esc(n.createdAtLabel||'')}</div><div style="white-space:pre-wrap;line-height:1.5">${esc(n.transcription||'')}</div><button class="btn" data-edit-note="${esc(n.id)}">Edit</button></article>`).join('')}</div>`;$('newPatientNoteBtn').onclick=()=>openEditor(g.patient,null);content.querySelectorAll('[data-edit-note]').forEach(b=>b.onclick=()=>{const n=notes.find(x=>x.id===b.dataset.editNote);openEditor(notePatient(n),n)})}
function armOcr(){ocrCapture.value='';setTimeout(()=>ocrCapture.focus({preventScroll:true}),250)}
function stopOcr(){ocrCapture.blur();ocrCapture.value=''}
function handleOcr(){const p=parseCredential(ocrCapture.value);if(!p)return;ocrCapture.value='';const same=groups().find(g=>p.uhid&&g.patient.uhid===p.uhid);renderScan(same?{...same.patient,...p,name:p.name||same.patient.name}:p)}
ocrCapture.addEventListener('input',()=>{clearTimeout(ocrTimer);ocrTimer=setTimeout(handleOcr,500)});ocrCapture.addEventListener('paste',()=>setTimeout(handleOcr,50));
function subscribeNotes(){if(unsub)unsub();unsub=onSnapshot(query(collection(db,'users',currentUser.uid,'notes'),orderBy('createdAt','desc')),snap=>{notes=snap.docs.map(d=>{const x=d.data();return{...x,id:d.id,createdAtMs:x.createdAt?.toMillis?.()||0}});renderList()},e=>{console.error(e);patientList.innerHTML='<div class="sub" style="padding:10px">Unable to load notes.</div>'})}
loginForm.addEventListener('submit',async e=>{e.preventDefault();loginError.textContent='';loginBtn.disabled=true;loginBtn.textContent='Signing in...';try{await signInWithEmailAndPassword(auth,$('email').value.trim(),$('password').value);$('password').value=''}catch(err){loginError.textContent='Unable to sign in. Check email and password.'}finally{loginBtn.disabled=false;loginBtn.textContent='Sign in'}});
onAuthStateChanged(auth,async user=>{currentUser=user;if(!user){if(unsub)unsub();appShell.classList.add('hidden');loginScreen.classList.remove('hidden');return}await setDoc(doc(db,'users',user.uid),{email:user.email||'',emailUpdatedAt:serverTimestamp(),activeNurse:null,activeNurseUpdatedAt:serverTimestamp()},{merge:true});userEmail.textContent=user.email||'';loginScreen.classList.add('hidden');appShell.classList.remove('hidden');dateInput.value=isoDate(selectedDate);subscribeNotes();renderHome()});
$('signOutBtn').onclick=()=>signOut(auth);$('homeBtn').onclick=renderHome;$('newNoteBtn').onclick=()=>openEditor(activeScan||blankPatient(),null);$('listBtn').onclick=()=>appShell.classList.add('list-open');$('closeListBtn').onclick=()=>appShell.classList.remove('list-open');$('prevDateBtn').onclick=()=>{selectedDate.setDate(selectedDate.getDate()-1);dateInput.value=isoDate(selectedDate);selectedKey=null;renderHome();renderList()};$('nextDateBtn').onclick=()=>{selectedDate.setDate(selectedDate.getDate()+1);dateInput.value=isoDate(selectedDate);selectedKey=null;renderHome();renderList()};dateInput.onchange=()=>{const[y,m,d]=dateInput.value.split('-').map(Number);if(y&&m&&d)selectedDate=new Date(y,m-1,d);selectedKey=null;renderHome();renderList()};searchInput.oninput=renderList;patientList.addEventListener('click',e=>{const b=e.target.closest('[data-key]');if(b)openGroup(b.dataset.key)});if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js?v=206',{updateViaCache:'none'}).catch(()=>{});
</script>
</body>
</html>

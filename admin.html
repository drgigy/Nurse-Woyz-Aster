<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nurse WOYZ Admin</title>
<link rel="manifest" href="./manifest.webmanifest">
<style>
  :root{--ink:#1d2520;--muted:#6f7b72;--line:#dfe7e2;--panel:#f7faf7;--teal:#1f6656;--teal2:#174d41;--wash:#eaf5f1;--red:#d94b38}
  *{box-sizing:border-box}
  body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:#f4f7f4}
  button,input,textarea{font:inherit}
  .hidden{display:none!important}
  .login{min-height:100vh;display:grid;place-items:center;padding:22px}
  .login-card{width:min(420px,100%);background:white;border:1px solid var(--line);border-radius:16px;padding:26px;box-shadow:0 18px 50px -34px #000}
  .brand{display:inline-flex;align-items:center;gap:10px;border:3px solid #f45155;border-radius:999px;background:#17171d;color:white;padding:10px 18px;font-weight:900;font-size:24px;letter-spacing:.5px}
  .dot{width:24px;height:24px;border-radius:50%;background:#f45155;box-shadow:0 0 0 10px rgba(244,81,85,.22)}
  h1{margin:22px 0 8px;font-size:32px}
  .sub{color:var(--muted);line-height:1.45}
  label{display:block;margin:16px 0 7px;font-weight:800;font-size:13px}
  input,textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;background:white;color:var(--ink);padding:12px 13px;outline:none}
  input:focus,textarea:focus{border-color:#8ab9ab;box-shadow:0 0 0 3px rgba(31,102,86,.12)}
  .btn{min-height:42px;border:1px solid var(--line);border-radius:12px;background:white;color:var(--ink);font-weight:900;padding:0 16px;cursor:pointer}
  .btn.primary{background:var(--teal);border-color:var(--teal);color:white}
  .btn.primary:hover{background:var(--teal2)}
  .btn.danger{color:var(--red);background:#fff3f1;border-color:#f3cbc4}
  .login .btn{width:100%;margin-top:18px}
  .error{min-height:20px;margin-top:12px;color:var(--red);font-weight:800;font-size:13px}
  .app{height:100vh;display:grid;grid-template-columns:340px 1fr;background:white}
  .side{border-right:1px solid var(--line);background:#fbfdfb;display:flex;flex-direction:column;min-width:0}
  .side-head{padding:18px;border-bottom:1px solid var(--line)}
  .side .brand{font-size:18px;padding:7px 13px;border-width:2px}
  .side .dot{width:16px;height:16px;box-shadow:0 0 0 7px rgba(244,81,85,.22)}
  .date-row{display:flex;align-items:center;gap:8px}
  .icon{width:38px;height:38px;padding:0;border-radius:10px}
  .date-input{height:38px;font-weight:800;width:150px}
  .search{margin-top:10px}
  .list{padding:12px;overflow:auto;display:grid;gap:9px}
  .patient{border:1px solid transparent;background:transparent;border-radius:12px;padding:12px;text-align:left;cursor:pointer}
  .patient.active{background:var(--wash);border-color:#bedbd2}
  .patient-name{font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .patient-meta{margin-top:4px;color:var(--muted);font:800 12px ui-monospace,SFMono-Regular,Menlo,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .main{min-width:0;display:flex;flex-direction:column;height:100vh}
  .top{min-height:64px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:10px 16px;overflow:auto}
  .spacer{flex:1}
  .who{color:var(--muted);font-size:13px;font-weight:800;white-space:nowrap}
  .content{flex:1;overflow:auto;padding:30px}
  .empty{height:100%;display:grid;place-items:center;text-align:center;color:var(--muted)}
  .review{max-width:980px;margin:0 auto;display:grid;gap:16px}
  .hint{color:var(--muted);font-weight:800}
  .note-card{background:transparent;padding:0;display:grid;gap:12px}
  .note-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .note-title{font-size:20px;font-weight:900}
  .note-time{color:var(--muted);font:800 12px ui-monospace,SFMono-Regular,Menlo,monospace}
  .note-box{line-height:1.6;font-size:17px;white-space:pre-wrap;background:white;border:1px solid var(--line);border-radius:14px;padding:18px}
  .btn.reviewed{background:var(--teal);border-color:var(--teal);color:white}
  .status{min-height:18px;color:var(--muted);font-weight:800;font-size:13px}
  @media(max-width:760px){.app{grid-template-columns:1fr}.side{height:42vh;border-right:0;border-bottom:1px solid var(--line)}.content{padding:18px}.title{font-size:32px}.who{display:none}}
</style>
</head>
<body>
<section class="login" id="loginScreen">
  <form class="login-card" id="loginForm">
    <div class="brand"><span class="dot"></span>Nurse WOYZ</div>
    <h1>Admin</h1>
    <div class="sub">Sign in with the same Firebase user account to review notes.</div>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" required>
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <button class="btn primary" id="loginBtn">Sign in</button>
    <div class="error" id="loginError"></div>
  </form>
</section>
<section class="app hidden" id="app">
  <aside class="side">
    <div class="side-head">
      <div class="brand"><span class="dot"></span>Nurse WOYZ</div>
      <input class="search" id="searchInput" placeholder="Search patient or UHID">
    </div>
    <div class="list" id="patientList"></div>
  </aside>
  <main class="main">
    <div class="top">
      <div class="spacer"></div>
      <div class="date-row"><button class="btn icon" id="prevDateBtn">&lsaquo;</button><input class="date-input" id="dateInput" type="date"><button class="btn icon" id="nextDateBtn">&rsaquo;</button></div>
      <button class="btn" id="copyTopBtn" disabled>Copy note</button>
      <button class="btn" id="reviewTopBtn" disabled>Review</button>
      <button class="btn" id="emrTopBtn" disabled>Send to EMR</button>
      <div class="who" id="userEmail"></div>
      <button class="btn danger" id="signOutBtn">Sign out</button>
    </div>
    <div class="content" id="content"></div>
  </main>
</section>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js';
import { browserLocalPersistence, getAuth, onAuthStateChanged, setPersistence, signInWithEmailAndPassword, signOut } from 'https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js';
import { collection, doc, getFirestore, onSnapshot, orderBy, query, serverTimestamp, setDoc, updateDoc } from 'https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js';
import { firebaseConfig } from './firebase-config.js';
const fb=initializeApp(firebaseConfig), auth=getAuth(fb), db=getFirestore(fb);
setPersistence(auth,browserLocalPersistence);
const $=id=>document.getElementById(id);
const loginScreen=$('loginScreen'), loginForm=$('loginForm'), loginError=$('loginError'), loginBtn=$('loginBtn'), appShell=$('app'), patientList=$('patientList'), content=$('content'), dateInput=$('dateInput'), searchInput=$('searchInput'), userEmail=$('userEmail'), copyTopBtn=$('copyTopBtn'), reviewTopBtn=$('reviewTopBtn'), emrTopBtn=$('emrTopBtn');
let currentUser=null, unsub=null, notes=[], selectedDate=new Date(), selectedKey=null;
function isoDate(d){return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function patientKey(p){return p.uhid?`uhid:${p.uhid}`:`name:${[p.name,p.age,p.sex].map(x=>String(x||'').trim().toLowerCase()).join('|')}`}
function notePatient(n){const p=n.patientData||{};return{name:p.name||n.patientName||'',age:p.age||n.age||'',sex:p.sex||n.sex||'',uhid:p.uhid||n.uhid||''}}
function label(p){return p.name||'Unnamed patient'}
function meta(p){return[`UHID ${p.uhid||'NIL'}`,p.age?`${p.age} yrs`:'',p.sex||''].filter(Boolean).join(' · ')}
function groups(){const term=searchInput.value.trim().toLowerCase(), map=new Map();notes.filter(n=>n.visitDate===isoDate(selectedDate)&&n.deleted!==true).forEach(n=>{const p=notePatient(n), hay=[p.name,p.uhid,p.age,p.sex,n.transcription].join(' ').toLowerCase();if(term&&!hay.includes(term))return;const key=patientKey(p)||n.id,g=map.get(key)||{key,patient:p,notes:[]};if(!g.patient.uhid&&p.uhid)g.patient=p;g.notes.push(n);map.set(key,g)});return[...map.values()].map(g=>({...g,notes:g.notes.sort((a,b)=>(b.createdAtMs||0)-(a.createdAtMs||0))})).sort((a,b)=>(b.notes[0]?.createdAtMs||0)-(a.notes[0]?.createdAtMs||0))}
function renderList(){const gs=groups();patientList.innerHTML=gs.length?gs.map(g=>`<button class="patient ${g.key===selectedKey?'active':''}" data-key="${esc(g.key)}"><div class="patient-name">${esc(label(g.patient))}</div><div class="patient-meta">${esc(meta(g.patient))} · ${g.notes.length} note${g.notes.length===1?'':'s'}</div></button>`).join(''):`<div class="hint" style="padding:10px">${searchInput.value?'No matching patients.':'No notes for this date.'}</div>`}
function selectedGroup(){return selectedKey?groups().find(x=>x.key===selectedKey):null}
function selectedNotes(){return selectedGroup()?.notes||[]}
function copyBody(text){return String(text||'').replace(/^\s*(?:Patient Name|Name|Age|UHID|Sex):[^\n]*(?:\n|$)/gim,'').trim()}
function selectedCopyText(){return selectedNotes().map(n=>copyBody(n.transcription)).filter(Boolean).join('\n\n')}
function setActionState(){const hasNotes=selectedNotes().length>0;copyTopBtn.disabled=!hasNotes;reviewTopBtn.disabled=!hasNotes;emrTopBtn.disabled=!hasNotes;const reviewed=hasNotes&&selectedNotes().every(n=>n.reviewed||n.reviewedAt||n.status==='Reviewed');reviewTopBtn.textContent=reviewed?'Reviewed':'Review';reviewTopBtn.classList.toggle('reviewed',reviewed)}
function renderEmpty(){selectedKey=null;setActionState();content.innerHTML='<div class="empty"><div><h1>No patient selected</h1><div>Select a patient from the left list.</div></div></div>'}
function openGroup(key){selectedKey=key;renderList();const g=selectedGroup();if(!g)return renderEmpty();content.innerHTML=`<div class="review">${g.notes.map(n=>`<article class="note-card"><div class="note-head"><div class="note-title">Progress Note</div><div class="note-time">${esc(n.createdAtLabel||'')}</div></div><div class="note-box" data-note-text="${esc(n.id)}">${esc(n.transcription||'')}</div></article>`).join('')}<div class="status" id="topStatus"></div></div>`;setActionState()}
async function copySelectedNotes(){const text=selectedCopyText();if(!text)return;await navigator.clipboard.writeText(text);const status=$('topStatus');if(status){status.textContent='Copied';setTimeout(()=>status.textContent='',1200)}}
async function markSelectedReviewed(){const items=selectedNotes();if(!items.length)return;items.forEach(n=>{n.reviewed=true;n.status='Reviewed'});setActionState();await Promise.all(items.map(n=>updateDoc(doc(db,'users',currentUser.uid,'notes',n.id),{reviewed:true,status:'Reviewed',reviewedAt:serverTimestamp(),reviewedBy:currentUser.uid,updatedAt:serverTimestamp()})));const status=$('topStatus');if(status){status.textContent='Reviewed';setTimeout(()=>status.textContent='',1200)}}
function showEmrSoon(){emrTopBtn.textContent='Coming Soon'}
function changeDateBy(days){selectedDate.setDate(selectedDate.getDate()+days);dateInput.value=isoDate(selectedDate);selectedKey=null;renderList();renderEmpty()}
function subscribeNotes(){if(unsub)unsub();unsub=onSnapshot(query(collection(db,'users',currentUser.uid,'notes'),orderBy('createdAt','desc')),snap=>{notes=snap.docs.map(d=>{const x=d.data();return{...x,id:d.id,createdAtMs:x.createdAt?.toMillis?.()||0}});renderList();if(selectedKey&&groups().some(g=>g.key===selectedKey))openGroup(selectedKey);else renderEmpty()},e=>{console.error(e);patientList.innerHTML='<div class="hint" style="padding:10px">Unable to load notes.</div>'})}
loginForm.addEventListener('submit',async e=>{e.preventDefault();loginError.textContent='';loginBtn.disabled=true;loginBtn.textContent='Signing in...';try{await signInWithEmailAndPassword(auth,$('email').value.trim(),$('password').value);$('password').value=''}catch(err){loginError.textContent='Unable to sign in. Check email and password.'}finally{loginBtn.disabled=false;loginBtn.textContent='Sign in'}});
onAuthStateChanged(auth,async user=>{currentUser=user;if(!user){if(unsub)unsub();appShell.classList.add('hidden');loginScreen.classList.remove('hidden');return}await setDoc(doc(db,'users',user.uid),{email:user.email||'',emailUpdatedAt:serverTimestamp(),activeNurse:null,activeNurseUpdatedAt:serverTimestamp()},{merge:true});userEmail.textContent=user.email||'';loginScreen.classList.add('hidden');appShell.classList.remove('hidden');dateInput.value=isoDate(selectedDate);subscribeNotes();renderEmpty()});
$('signOutBtn').onclick=()=>signOut(auth);$('prevDateBtn').onclick=()=>changeDateBy(-1);$('nextDateBtn').onclick=()=>changeDateBy(1);dateInput.onchange=()=>{const[y,m,d]=dateInput.value.split('-').map(Number);if(y&&m&&d)selectedDate=new Date(y,m-1,d);selectedKey=null;renderList();renderEmpty()};searchInput.oninput=renderList;patientList.addEventListener('click',e=>{const b=e.target.closest('[data-key]');if(b)openGroup(b.dataset.key)});copyTopBtn.onclick=()=>copySelectedNotes().catch(console.error);reviewTopBtn.onclick=()=>markSelectedReviewed().catch(console.error);emrTopBtn.onclick=showEmrSoon;if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js?v=212',{updateViaCache:'none'}).catch(()=>{});
</script>
</body>
</html>
